extends:
  - default-with-fallback-font
title-page:
  align: left
  logo:
    top: 0%
page:
  margin: [0.75in, 1in, 0.75in, 1in]
base:
  font-size: 11
  line-height-length: 16
heading:
  font-size: 12
  line-height: 1.2

link:
  font-color: #009900
header:
  height: 0.75in
  line-height: 1
  font-color: #FF0000
  recto:
    right:
      content: '{document-title}'
  verso:
    left:
      content: '{document-title}'
footer:
  height: 0.75in
  line-height: 1
  recto:
    right:
      content: '{chapter-title} | *{page-number}*'
  verso:
    left:
      content: '*{page-number}* | {chapter-title}'
image:
  align: center
caption:
  align: center
  font-color: #FF0000
  font-size: 10
role:
  small:
    font-size: 9
    line-height: 1.1
  subtitle:
    font-size: 13
    font-color: #000000
    font-style: bold
